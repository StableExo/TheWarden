[build]
builder = "NIXPACKS"
# GL-L29: No Hardhat needed — CounterSweeper bytecode is pre-compiled and embedded
# Prints TypeScript diagnostics into the build log but never fails the build (`|| true`).
buildCommand = "npm install && (npx tsc --noEmit || true)"

[deploy]
# Base-native entrypoint (was: one-shot CounterSweeper deploy, then the Ethereum arb-loop).
# NOTE: the Railway service currently has a dashboard "Custom Start Command" that
# OVERRIDES this value and points at ethereum-mainnet/scripts/arb-loop.ts. Clear that
# override to let this Base entrypoint take effect.
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/health"

# Env vars, set in the Railway dashboard (values never live in git):
#   WALLET_PRIVATE_KEY  = <EOA private key>       (required for startup validation)
#   BASE_RPC_URL        = <Base RPC URL>          (required for startup validation)
#   RPC_URL             = <Base RPC URL>          (optional; overrides BASE_RPC_URL)
#   ENABLE_FLASHSWAP_V3 = false                   (optional; keep false until v6.0.0 is deployed)
#   CDP_PAYMASTER_URL   = <Coinbase CDP paymaster RPC URL>
#   CHAINSTACK_HTTPS    = <Chainstack HTTPS RPC URL>
#   BASE_WSS_URL        = <Base WSS URL>
#
# Beneficiary: 0xfBe1783869504e07052d57A39867f82D5e3563B5 (Taylor's Coinbase)
